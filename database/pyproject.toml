[project]
name = "hive-inspect-database-tests"
version = "0.0.0"
description = "Integration tests for the Hive Inspect PostgreSQL schema (migrations)"
requires-python = ">=3.13"
license = { text = "UNLICENSED" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]